name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: windows-latest
            out: blockhost-windows.exe
            built: dist/blockhost.exe
          - os: ubuntu-22.04   # older glibc so the binary runs on more distros
            out: blockhost-linux
            built: dist/blockhost
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version matches tag
        shell: bash
        run: |
          v=$(python -c "import blockhost; print(blockhost.__version__)")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "blockhost.__version__ ($v) != tag (${GITHUB_REF_NAME})"; exit 1; }
      - name: Build
        shell: bash
        run: ./packaging/build.sh
      - name: Smoke test
        shell: bash
        run: ${{ matrix.built }} --version
      - shell: bash
        run: mv ${{ matrix.built }} ${{ matrix.out }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: blockhost-*   # skip the Docker build-record artifact
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --title "Blockhost ${GITHUB_REF_NAME}" \
            --notes "Download **blockhost-windows.exe** (Windows 10/11, x64) or **blockhost-linux** (x86_64 Linux). Docker: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\`. See the README to get started."

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
