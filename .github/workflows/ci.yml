name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest ruff
      - run: ruff check .
      - run: python -m pytest -q
      - name: CLI starts
        run: python -m blockhost --version

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t blockhost:ci .
      - name: Container serves the web page
        run: |
          docker run -d --name bh -p 8080:8080 blockhost:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/auth/status && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/auth/status | grep -q '"needs_setup": true'
          docker logs bh | grep -q "Setup code"
          docker stop bh
